name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. CI only reads the repository; nothing here writes to it, and
# a compromised dependency running in a job with a write-scoped token could push.
permissions:
  contents: read
  deployments: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test -- --coverage

      # Advisories in build tooling are noise for a game that ships no server of
      # its own; advisories in code that reaches a device are not. Only the
      # production tree is a build failure.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit build tooling (advisory only)
        run: npm audit || true

      # The gate that everything else rests on: the simulation must produce
      # identical results in a browser and in Node, or the leaderboard is fiction.
      # It runs on every push, not just on main, because a divergence found late
      # invalidates every score already submitted.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Cross-engine parity
        run: npx playwright test --project=parity

      - name: End-to-end
        run: npx playwright test --project=app

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build --workspace=@fuse/game
      - run: npx cap sync android
        working-directory: apps/game

      # Proves the store artefact still builds. Signing happens in the release
      # workflow, not here — CI never touches the upload key.
      - name: Build AAB
        run: ./gradlew bundleDebug --no-daemon
        working-directory: apps/game/android

  # ---------------------------------------------------------------------------
  # Deploy the API
  #
  # Only after both `verify` and `android` pass, and only on main. The Android
  # job is included on purpose: the AAB and the Worker share the simulation, so
  # a commit that breaks the app build should not put its server half live.
  #
  # The app itself is not deployed from here — it goes to Play through a signed
  # bundle and a review queue. See docs/release.md.
  # ---------------------------------------------------------------------------
  deploy-api:
    needs: [verify, android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: deploy-fuse-api
      cancel-in-progress: false

    environment:
      name: production
      url: https://api-fuse-app.andrewgarcia.dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Until the two secrets exist this job reports a notice and stops, rather
      # than failing. A red X on every push for a setup step nobody has done yet
      # teaches people to ignore red X's.
      - name: Are the Cloudflare credentials configured?
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Migrations run before the code that depends on them, and wrangler only
      # applies what has not been applied. They are forward-only and additive by
      # convention (see the migration discipline in the blueprint) — a migration
      # that drops or renames a column would run automatically here, which is
      # exactly why that convention exists.
      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --config is required: wrangler searches upward and would otherwise
          # miss this file entirely from the repository root.
        run: npx wrangler d1 migrations apply fuse-db --remote --config ./wrangler.toml

      - name: Deploy the Worker
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --config ./wrangler.toml

      # A deployed Worker that cannot reach its database returns 500 on the
      # first real request. Better to find that here than from a player.
      # Deliberately a *rejected* submission, not a successful one.
      #
      # Before the Worker can decide a claimed score is wrong it verifies the
      # token, validates the payload, checks the date, queries D1 for the attempt
      # count, derives the board and re-runs the simulation. SCORE_MISMATCH is
      # therefore a receipt for the whole path — and unlike a real run, it leaves
      # nothing on the leaderboard players actually compete on. An earlier
      # version submitted genuine runs and put invented names on the live board.
      - name: Smoke test the live API
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -e
          url="${{ vars.FUSE_API_BASE || 'https://api-fuse-app.andrewgarcia.dev' }}"
          today=$(date -u +%F)

          code=$(curl -s -o /tmp/player.json -w '%{http_code}' -X POST "$url/v1/players")
          echo "POST /v1/players -> $code"
          test "$code" = "201"
          token=$(python3 -c "import json;print(json.load(open('/tmp/player.json'))['token'])")

          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/v1/daily/$today")
          echo "GET /v1/daily/$today -> $code"
          test "$code" = "200"

          code=$(curl -s -o /tmp/probe.json -w '%{http_code}' -X POST "$url/v1/runs"             -H 'content-type: application/json' -H "authorization: Bearer $token"             -d "{\"date\":\"$today\",\"placements\":[{\"x\":1,\"y\":1,\"piece\":1}],\"clientScore\":999999}")
          echo "POST /v1/runs (deliberately wrong score) -> $code"
          test "$code" = "422"
          grep -q 'SCORE_MISMATCH' /tmp/probe.json
          echo "the Worker replayed the run and refused it, as it should"
