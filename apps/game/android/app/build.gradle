apply plugin: 'com.android.application'

android {
    namespace = "gg.fuse.daily"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "gg.fuse.daily"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Play rejects an upload whose versionCode is not higher than the last.
        // Read from an env var so a release can be cut without editing a file:
        //   FUSE_VERSION_CODE=2 FUSE_VERSION_NAME=0.2.3 ./gradlew bundleRelease
        versionCode(System.getenv("FUSE_VERSION_CODE") ? System.getenv("FUSE_VERSION_CODE").toInteger() : 1)
        versionName(System.getenv("FUSE_VERSION_NAME") ?: "0.2.2")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * Signing.
     *
     * Configured entirely from the environment so the keystore and its passwords
     * never enter the repository, and a release can be built in CI without a
     * human editing a tracked file:
     *
     *   FUSE_KEYSTORE=/path/upload.jks FUSE_KEYSTORE_PASSWORD=...      *   FUSE_KEY_ALIAS=upload FUSE_KEY_PASSWORD=... ./gradlew bundleRelease
     *
     * With no keystore set the release build is simply unsigned, which is what
     * a plain CI verification build wants.
     */
    signingConfigs {
        release {
            def keystorePath = System.getenv("FUSE_KEYSTORE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("FUSE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FUSE_KEY_ALIAS")
                keyPassword System.getenv("FUSE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Shrinks the AndroidX and Capacitor runtime, which is the bulk of
            // the download: the game itself is well under 100 KB.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("FUSE_KEYSTORE") ? signingConfigs.release : null
        }
    }

    /* Reproducible-ish builds: keep the AAB stable across machines. */
    packagingOptions {
        jniLibs { useLegacyPackaging false }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
