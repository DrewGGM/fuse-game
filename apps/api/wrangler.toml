name = "fuse-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Observability is on from day one: the alarm that matters is the rate of
# SCORE_MISMATCH, and you cannot alert on logs you never collected.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "fuse-db"
# Created 2026-08-20. Not a secret: it names the database, it does not grant
# access — that comes from the account binding.
database_id = "832de55e-9515-4c30-985f-2cb13b0e7b6e"
migrations_dir = "migrations"

# The Android app's own leaderboard, separate from the web one.
#
# Flat hostname rather than nesting under the site's subdomain, matching
# api-fuse.andrewgarcia.dev. The two are deliberately different Workers with
# different databases: same code, same scoring, separate communities.
[[routes]]
pattern = "api-fuse-app.andrewgarcia.dev"
custom_domain = true

# TOKEN_SECRET is deliberately NOT here.
#
# It signs player tokens, so it is set once with
#   npx wrangler secret put TOKEN_SECRET
# and lives only in Cloudflare. It briefly sat in a [vars] block for local
# development, which would have shipped a known value to production and
# overridden the real secret — vars in this file win over nothing, they simply
# become the deployed value. Local development reads it from .dev.vars, which
# is gitignored.

